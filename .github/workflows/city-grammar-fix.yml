name: SEO city grammar fix

on:
  push:
    paths:
      - '.github/workflows/city-grammar-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Russian city cases
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          forms={
            'surgut':('Сургут','Сургута','Сургуте'),
            'megion':('Мегион','Мегиона','Мегионе'),
            'langepas':('Лангепас','Лангепаса','Лангепасе'),
            'kogalym':('Когалым','Когалыма','Когалыме'),
            'noyabrsk':('Ноябрьск','Ноябрьска','Ноябрьске'),
          }
          for slug,(nom,gen,prep) in forms.items():
              p=Path(slug)/'index.html'
              t=p.read_text(encoding='utf-8')
              t=t.replace(f'из {nom}',f'из {gen}')
              t=t.replace(f'в {nom}?',f'в {prep}?')
              t=t.replace(f'в {nom}.',f'в {prep}.')
              t=t.replace(f'в {nom}</h3>',f'в {prep}</h3>')
              p.write_text(t,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surgut megion langepas kogalym noyabrsk
          git commit -m "SEO: fix Russian city name inflections"
          git push
